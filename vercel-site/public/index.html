<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReelEstate</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container {
            padding: 2rem;
            max-width: 480px;
        }
        .logo {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #007AFF, #00D4FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .tagline {
            color: #888;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }
        .message {
            color: #aaa;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .app-store-btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #007AFF, #00D4FF);
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: opacity 0.2s;
        }
        .app-store-btn:hover { opacity: 0.85; }
    </style>
    <script>
        // Try to open the app via custom scheme for deep link paths
        (function() {
            var path = window.location.pathname;
            if (path.startsWith('/listing/') || path.startsWith('/reel/')) {
                var appURL = 'reelestate://' + path.substring(1);
                window.location.href = appURL;
            }
        })();
    </script>
</head>
<body>
    <div class="container">
        <div class="logo">🏠</div>
        <h1>ReelEstate</h1>
        <p class="tagline">Real Estate, Reimagined</p>
        <p class="message">
            Open this link on your iPhone to view it in the ReelEstate app.
        </p>
        <!-- Update this href when your app is on the App Store -->
        <a href="https://apps.apple.com" class="app-store-btn">Download on the App Store</a>
    </div>
</body>
</html>
